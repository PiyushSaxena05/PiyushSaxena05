<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 204" width="490" height="204">
<defs>
  <linearGradient id="bd" x1="0" x2="1" y1="0" y2="1" spreadMethod="reflect"><stop offset="0" stop-color="#FBBF24"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FBBF24"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#141a3a"/></linearGradient>
  <linearGradient id="shim" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity="0"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient>
  <clipPath id="cc"><rect x="1" y="1" width="488" height="202" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="488" height="202" rx="16" fill="url(#bgc)"/>
<g clip-path="url(#cc)">
  <text x="478" y="150" text-anchor="end" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="110" font-weight="900" fill="#fff" opacity=".045">08</text>
  <rect x="-160" y="1" width="160" height="3" fill="url(#shim)"><animate attributeName="x" from="-160" to="490" dur="4s" repeatCount="indefinite"/></rect>
</g>
<rect x="1" y="1" width="488" height="202" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" stroke-opacity=".75"/>
<text x="28" y="40" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#FBBF24">SPRING MVC · CRUD</text>
<text x="28" y="72" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">Task Management System</text>
<text x="28" y="98" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">CRUD task manager built on Spring MVC, Spring Data JPA</text><text x="28" y="118" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">and Lombok, with DTOs cleanly separating entities</text><text x="28" y="138" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">from API responses.</text><rect x="28" y="160" width="87" height="24" rx="12" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/><text x="71.5" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#FBBF24">Spring MVC</text><rect x="123" y="160" width="120" height="24" rx="12" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/><text x="183.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#FBBF24">Spring Data JPA</text><rect x="251" y="160" width="60" height="24" rx="12" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/><text x="281.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#FBBF24">Lombok</text>
</svg>