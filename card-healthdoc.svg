<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 204" width="490" height="204">
<defs>
  <linearGradient id="bd" x1="0" x2="1" y1="0" y2="1" spreadMethod="reflect"><stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#38BDF8"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#141a3a"/></linearGradient>
  <linearGradient id="shim" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
  <clipPath id="cc"><rect x="1" y="1" width="488" height="202" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="488" height="202" rx="16" fill="url(#bgc)"/>
<g clip-path="url(#cc)">
  <text x="478" y="150" text-anchor="end" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="110" font-weight="900" fill="#fff" opacity=".045">05</text>
  <rect x="-160" y="1" width="160" height="3" fill="url(#shim)"><animate attributeName="x" from="-160" to="490" dur="4s" repeatCount="indefinite"/></rect>
</g>
<rect x="1" y="1" width="488" height="202" rx="16" fill="none" stroke="url(#bd)" stroke-width="1.6" stroke-opacity=".75"/>
<text x="28" y="40" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#38BDF8">HEALTHCARE · ACCESS CONTROL</text>
<text x="28" y="72" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">Healthdoc</text>
<text x="28" y="98" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">Securely manages doctor–patient records. Doctors add</text><text x="28" y="118" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">patient info and assign access; patients can view</text><text x="28" y="138" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#AAB2C5">only their own records.</text><rect x="28" y="160" width="46" height="24" rx="12" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/><text x="51.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#38BDF8">Java</text><rect x="82" y="160" width="53" height="24" rx="12" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/><text x="108.5" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#38BDF8">MySQL</text><rect x="143" y="160" width="46" height="24" rx="12" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/><text x="166.0" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#38BDF8">JDBC</text>
</svg>